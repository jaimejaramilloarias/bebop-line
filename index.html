<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bebop Line - Jaime Jaramillo Arias</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' ry='6' fill='%23663FB5'/%3E%3Ctext x='16' y='21' font-size='16' text-anchor='middle' fill='white' font-family='Arial, sans-serif'%3EBL%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="app-header">
      <h1>Bebop Line - Jaime Jaramillo Arias</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema" title="Alternar tema claro/oscuro">
        🌗
      </button>
    </header>

    <main>
      <section class="midi-panel" aria-label="Controles MIDI">
        <div class="midi-sidebar" role="menubar">
          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Captura MIDI" role="menuitem" type="button">🎙️</button>
            <div class="midi-flyout" role="group" aria-label="Captura MIDI">
              <button
                id="midi-learn"
                class="toggle"
                title="Activar o desactivar la captura MIDI continua"
                aria-pressed="false"
              >
                <span class="label">MIDI Learn</span>
                <span class="state" aria-live="polite">(apagado)</span>
                <span class="indicator" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Ritmo y swing" role="menuitem" type="button">⏱️</button>
            <div class="midi-flyout" role="group" aria-label="Ajustes de tempo y swing">
              <label class="midi-input" for="tempo">
                <span class="midi-input__label">Tempo</span>
                <div class="midi-input__field">
                  <input
                    id="tempo"
                    type="number"
                    min="40"
                    max="320"
                    value="280"
                    inputmode="numeric"
                    aria-describedby="tempo-help"
                    title="Ajustar tempo en BPM"
                  />
                  <span class="midi-input__suffix" id="tempo-help" aria-hidden="true">BPM</span>
                </div>
              </label>
              <label class="midi-input" for="swing">
                <span class="midi-input__label">Swing</span>
                <div class="midi-input__field">
                  <input
                    id="swing"
                    type="number"
                    min="0"
                    max="100"
                    value="28"
                    inputmode="numeric"
                    aria-describedby="swing-help"
                    title="Aplicar swing solo a la reproducción"
                  />
                  <span class="midi-input__suffix" id="swing-help" aria-hidden="true">%</span>
                </div>
              </label>
            </div>
          </div>

          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Reproducción" role="menuitem" type="button">▶️</button>
            <div class="midi-flyout" role="group" aria-label="Reproducción">
              <button
                id="play-toggle"
                class="primary"
                title="Reproducir o detener la línea generada"
                aria-pressed="false"
              >
                Reproducir
              </button>
              <button id="regenerate-line" title="Generar una nueva línea usando los mismos acordes capturados">
                Nueva línea
              </button>
              <button id="export-midi" title="Exportar la línea como archivo MIDI">Exportar MIDI</button>
              <button id="clear-chords" title="Eliminar acordes capturados">Borrar acordes</button>
            </div>
          </div>

          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Transposición" role="menuitem" type="button">📈</button>
            <div class="midi-flyout" role="group" aria-label="Transposición">
              <button type="button" id="transpose-down-octave" title="Bajar una octava">−8va</button>
              <span id="transpose-value" class="transpose-value" aria-live="polite"></span>
              <button type="button" id="transpose-up-octave" title="Subir una octava">+8va</button>
              <button type="button" id="transpose-down-semitone" title="Bajar un semitono">−1</button>
              <button type="button" id="transpose-reset" class="transpose-reset" title="Restablecer transposición">
                Reset
              </button>
              <button type="button" id="transpose-up-semitone" title="Subir un semitono">+1</button>
            </div>
          </div>

          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Salida MIDI" role="menuitem" type="button">🔈</button>
            <div class="midi-flyout" role="group" aria-label="Salida MIDI">
              <label for="midi-output" title="Enviar la reproducción a un puerto MIDI externo">Destino</label>
              <div class="midi-output__controls">
                <select
                  id="midi-output"
                  title="Seleccionar un puerto MIDI de salida para reproducir la línea"
                  aria-label="Puerto MIDI de salida"
                >
                  <option value="">Reproducción interna (WebAudio)</option>
                </select>
                <button id="refresh-midi-outputs" title="Actualizar la lista de puertos MIDI disponibles">
                  Actualizar
                </button>
              </div>
            </div>
          </div>

          <div class="midi-sidebar__item" role="none">
            <button class="midi-icon" aria-label="Acordes capturados" role="menuitem" type="button">🎹</button>
            <div class="midi-flyout midi-flyout--wide" role="group" aria-label="Acordes capturados">
              <div class="captured-chords" aria-live="polite" aria-label="Acordes capturados"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="visualizations" aria-labelledby="visualizations-title">
        <div class="section-title" id="visualizations-title">Distribución de alturas</div>
        <div
          class="matrix"
          aria-label="Matriz de alturas. Arrastra patrones para reordenar cada compás"
          role="img"
        ></div>
        <div class="section-title section-title--score" id="score-title">Partitura generada</div>
        <div
          id="score-viewer"
          class="score-viewer"
          role="img"
          aria-labelledby="score-title"
          aria-live="polite"
        >
          <p class="score-placeholder">Captura acordes con MIDI Learn para generar la partitura.</p>
        </div>
      </section>
    </main>

    <div id="status" class="sr-only" aria-live="assertive"></div>

    <script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
