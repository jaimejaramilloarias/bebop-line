<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bebop Line - Jaime Jaramillo Arias</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' ry='6' fill='%23663FB5'/%3E%3Ctext x='16' y='21' font-size='16' text-anchor='middle' fill='white' font-family='Arial, sans-serif'%3EBL%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="app-header">
      <h1>Bebop Line - Jaime Jaramillo Arias</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema" title="Alternar tema claro/oscuro">
        🌗
      </button>
    </header>

    <main>
      <section class="control-stack" aria-label="Controles principales">
        <div class="control-bar control-bar--compact" role="group" aria-label="Acciones rápidas">
          <div class="control-bar__icons" role="group" aria-label="Herramientas">
            <button
              id="open-pattern-dictionary"
              class="control-button control-button--icon-only"
              type="button"
              title="Abrir el diccionario completo de patrones melódicos"
              aria-label="Diccionario de patrones melódicos"
            >
              <span aria-hidden="true">📖</span>
            </button>
            <button
              id="undo-action"
              class="control-button control-button--icon-only"
              type="button"
              title="Deshacer el último cambio"
              aria-label="Deshacer"
            >
              <span aria-hidden="true">↶</span>
            </button>
            <button
              id="redo-action"
              class="control-button control-button--icon-only"
              type="button"
              title="Rehacer el cambio revertido"
              aria-label="Rehacer"
            >
              <span aria-hidden="true">↷</span>
            </button>
          </div>
          <button
            id="midi-learn"
            class="control-button toggle control-button--icon-only"
            title="Activar o desactivar la captura MIDI continua"
            aria-pressed="false"
          >
            <span class="sr-only label">MIDI Learn</span>
            <span class="sr-only state" aria-live="polite">(apagado)</span>
            <span class="indicator" aria-hidden="true"></span>
            <span class="control-button__icon" aria-hidden="true">🎛️</span>
          </button>
          <div class="control-bar__spacer" aria-hidden="true"></div>
          <label class="midi-input control-field" for="tempo">
            <span class="midi-input__label">Tempo</span>
            <div class="midi-input__field">
              <input
                id="tempo"
                type="number"
                min="40"
                max="320"
                value="280"
                inputmode="numeric"
                aria-describedby="tempo-help"
                title="Ajustar tempo en BPM"
              />
              <span class="midi-input__suffix" id="tempo-help" aria-hidden="true">BPM</span>
            </div>
          </label>
          <label class="midi-input control-field" for="swing">
            <span class="midi-input__label">Swing</span>
            <div class="midi-input__field">
              <input
                id="swing"
                type="number"
                min="0"
                max="100"
                value="28"
                inputmode="numeric"
                aria-describedby="swing-help"
                title="Aplicar swing solo a la reproducción"
              />
              <span class="midi-input__suffix" id="swing-help" aria-hidden="true">%</span>
            </div>
          </label>
        </div>

        <div class="control-bar" role="group" aria-label="Transposición global y acordes">
          <div class="control-group" role="group" aria-label="Transposición global">
            <span class="control-group__label">Transposición</span>
            <div class="transpose-controls">
              <button
                type="button"
                id="transpose-down-octave"
                class="control-button control-button--icon-only"
                title="Bajar una octava"
              >
                <span aria-hidden="true">⏬</span>
                <span class="sr-only">Bajar una octava</span>
              </button>
              <button
                type="button"
                id="transpose-down-semitone"
                class="control-button control-button--icon-only"
                title="Bajar un semitono"
              >
                <span aria-hidden="true">⏷</span>
                <span class="sr-only">Bajar un semitono</span>
              </button>
              <span id="transpose-value" class="transpose-value" aria-live="polite"></span>
              <button
                type="button"
                id="transpose-up-semitone"
                class="control-button control-button--icon-only"
                title="Subir un semitono"
              >
                <span aria-hidden="true">⏶</span>
                <span class="sr-only">Subir un semitono</span>
              </button>
              <button
                type="button"
                id="transpose-up-octave"
                class="control-button control-button--icon-only"
                title="Subir una octava"
              >
                <span aria-hidden="true">⏫</span>
                <span class="sr-only">Subir una octava</span>
              </button>
              <button
                type="button"
                id="transpose-reset"
                class="control-button control-button--icon-only transpose-reset"
                title="Restablecer transposición"
              >
                <span aria-hidden="true">⟲</span>
                <span class="sr-only">Restablecer transposición</span>
              </button>
            </div>
          </div>

          <div class="control-group control-group--fill" aria-label="Acordes capturados">
            <span class="control-group__label">Acordes</span>
            <div class="captured-chords" aria-live="polite" aria-label="Acordes capturados"></div>
          </div>
        </div>

        <div class="control-bar control-bar--compact" role="group" aria-label="Transposición de lectura y notación">
          <div class="control-group control-group--inline" role="group" aria-label="Transposición de lectura">
            <span class="control-group__label">Lectura</span>
            <div class="view-transpose-buttons">
              <button
                type="button"
                class="control-button control-button--icon-only view-transpose-button"
                data-transpose-display="0"
                id="view-transpose-concert"
                title="Partitura en tono de concierto"
                aria-pressed="true"
              >
                <span aria-hidden="true">🎼</span>
                <span class="sr-only">Tono de concierto</span>
              </button>
              <button
                type="button"
                class="control-button view-transpose-button"
                data-transpose-display="2"
                title="Transponer la partitura una segunda mayor arriba (instrumentos en Bb)"
              >
                Bb
              </button>
              <button
                type="button"
                class="control-button view-transpose-button"
                data-transpose-display="9"
                title="Transponer la partitura una sexta mayor arriba (instrumentos en Eb)"
              >
                Eb
              </button>
              <button
                type="button"
                class="control-button view-transpose-button"
                data-transpose-display="-12"
                title="Transponer la partitura una octava abajo (guitarra)"
              >
                8↓
              </button>
            </div>
          </div>

          <div class="control-group control-group--inline" role="group" aria-label="Opciones de notación">
            <span class="control-group__label">Notación</span>
            <div class="notation-buttons">
              <button
                type="button"
                id="enharmonic-toggle"
                class="control-button control-button--icon-only"
                title="Alternar la enarmonía preferida"
              >
                <span aria-hidden="true">♯♭</span>
                <span class="sr-only">Alternar la enarmonía preferida</span>
              </button>
              <button
                type="button"
                id="clef-toggle"
                class="control-button control-button--icon-only"
                title="Cambiar entre clave de sol y clave de fa"
              >
                <span aria-hidden="true">𝄞/𝄢</span>
                <span class="sr-only">Cambiar la clave utilizada en la partitura</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="visualizations" aria-labelledby="visualizations-title">
        <div class="section-title" id="visualizations-title">Distribución de alturas</div>
        <div class="matrix-toolbar" role="group" aria-label="Transposición de patrones seleccionados">
          <div class="matrix-toolbar__buttons">
            <button
              type="button"
              id="matrix-clear-selection"
              class="control-button control-button--icon-only"
              title="Quitar la selección de compases"
            >
              <span aria-hidden="true">✕</span>
              <span class="sr-only">Quitar selección</span>
            </button>
            <button
              type="button"
              id="matrix-transpose-down-octave"
              class="control-button control-button--icon-only"
              title="Bajar una octava los patrones seleccionados"
            >
              <span aria-hidden="true">⏬</span>
              <span class="sr-only">Bajar una octava los patrones seleccionados</span>
            </button>
            <button
              type="button"
              id="matrix-transpose-down-semitone"
              class="control-button control-button--icon-only"
              title="Bajar un semitono los patrones seleccionados"
            >
              <span aria-hidden="true">⏷</span>
              <span class="sr-only">Bajar un semitono los patrones seleccionados</span>
            </button>
            <button
              type="button"
              id="matrix-transpose-reset"
              class="control-button control-button--icon-only"
              title="Restablecer la transposición de los patrones seleccionados"
            >
              <span aria-hidden="true">⟲</span>
              <span class="sr-only">Restablecer la transposición de los patrones seleccionados</span>
            </button>
            <button
              type="button"
              id="matrix-transpose-up-semitone"
              class="control-button control-button--icon-only"
              title="Subir un semitono los patrones seleccionados"
            >
              <span aria-hidden="true">⏶</span>
              <span class="sr-only">Subir un semitono los patrones seleccionados</span>
            </button>
            <button
              type="button"
              id="matrix-transpose-up-octave"
              class="control-button control-button--icon-only"
              title="Subir una octava los patrones seleccionados"
            >
              <span aria-hidden="true">⏫</span>
              <span class="sr-only">Subir una octava los patrones seleccionados</span>
            </button>
          </div>
          <div
            id="matrix-selection-summary"
            class="matrix-toolbar__summary"
            aria-live="polite"
          ></div>
        </div>
        <div
          class="matrix"
          aria-label="Matriz de alturas. Arrastra patrones para reordenar cada compás"
          role="img"
        ></div>
        <div class="section-title section-title--score" id="score-title">Partitura generada</div>
        <div
          id="score-viewer"
          class="score-viewer"
          role="img"
          aria-labelledby="score-title"
          aria-live="polite"
        >
          <p class="score-placeholder">Captura acordes con MIDI Learn para generar la partitura.</p>
        </div>
      </section>

    </main>

    <section class="playback-toolbar" aria-label="Controles de reproducción">
      <div class="playback-toolbar__main">
        <button
          id="play-toggle"
          class="control-button control-button--icon-only control-button--primary"
          title="Reproducir o detener la línea generada"
          aria-pressed="false"
        >
          <span aria-hidden="true">▶</span>
          <span class="sr-only">Reproducir o detener la línea</span>
        </button>
        <button
          id="regenerate-line"
          class="control-button control-button--icon-only"
          title="Generar una nueva línea usando los mismos acordes capturados"
        >
          <span aria-hidden="true">🎲</span>
          <span class="sr-only">Generar una nueva línea</span>
        </button>
        <button
          id="export-midi"
          class="control-button control-button--icon-only"
          title="Exportar la línea como archivo MIDI"
        >
          <span aria-hidden="true">💾</span>
          <span class="sr-only">Exportar MIDI</span>
        </button>
        <button
          id="clear-chords"
          class="control-button control-button--icon-only"
          title="Eliminar acordes capturados"
        >
          <span aria-hidden="true">🧹</span>
          <span class="sr-only">Borrar acordes</span>
        </button>
      </div>
      <div class="playback-toolbar__outputs" role="group" aria-label="Salida MIDI">
        <span class="sr-only" id="midi-output-label">Puerto MIDI de salida</span>
        <div class="playback-toolbar__select">
          <span aria-hidden="true">🎧</span>
          <select
            id="midi-output"
            aria-labelledby="midi-output-label"
            title="Seleccionar un puerto MIDI de salida para reproducir la línea"
          >
            <option value="">Reproducción interna (WebAudio)</option>
          </select>
        </div>
        <button
          id="refresh-midi-outputs"
          class="control-button control-button--icon-only"
          title="Actualizar la lista de puertos MIDI disponibles"
          type="button"
        >
          <span aria-hidden="true">🔄</span>
          <span class="sr-only">Actualizar puertos MIDI</span>
        </button>
      </div>
    </section>

    <section class="virtual-keyboard" aria-label="Teclado virtual para introducir acordes">
      <div class="virtual-keyboard__header">
        <div class="section-title">Teclado virtual</div>
      </div>
      <div
        id="virtual-keyboard-selection"
        class="virtual-keyboard__selection"
        aria-live="polite"
      ></div>
      <div
        class="virtual-keyboard__scroller"
        role="group"
        aria-describedby="virtual-keyboard-selection"
      >
        <div class="virtual-keyboard__keys">
          <div class="virtual-keyboard__white-keys"></div>
          <div class="virtual-keyboard__black-keys"></div>
        </div>
      </div>
    </section>

    <div id="status" class="sr-only" aria-live="assertive"></div>

    <script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
